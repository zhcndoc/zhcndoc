name: zhcndoc

services:
  entry:
    image: traefik:v3
    container_name: entry-zhcndoc
    restart: unless-stopped
    ports:
      - '127.0.0.1:18080:80'
    command:
      - '--providers.docker.defaultRule=Host(`{{ index .Labels "com.docker.compose.service" }}.zhcndoc.com`)'
      - '--providers.docker.constraints=Label(`com.docker.compose.project`, `${COMPOSE_PROJECT_NAME}`)'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      traefik.enable: 'false'

  elysia:
    image: zhcndoc/elysia
    container_name: zhcndoc-elysia
    restart: unless-stopped

  drizzle:
    image: zhcndoc/drizzle
    container_name: zhcndoc-drizzle
    restart: unless-stopped

  vueuse:
    image: zhcndoc/vueuse
    container_name: zhcndoc-vueuse
    restart: unless-stopped

  unocss:

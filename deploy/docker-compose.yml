    container_name: zhcndoc-unocss
    restart: unless-stopped

  shiki:
    image: zhcndoc/shiki
    container_name: zhcndoc-shiki
    restart: unless-stopped

  vitest:
    image: zhcndoc/vitest
    container_name: zhcndoc-vitest
    restart: unless-stopped

  umami:
    image: zhcndoc/umami
    container_name: zhcndoc-umami
    restart: unless-stopped

  astro:
